name: Publish queued Instit release

on:
  push:
    branches:
      - publish

permissions:
  contents: write

concurrency:
  group: publish-instit-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out queued payload
        uses: actions/checkout@v7

      - name: Validate payload
        id: release
        working-directory: payload
        run: |
          test -s version.txt
          RELEASE_VERSION="$(tr -d '\r\n' < version.txt)"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid queued version."
            exit 1
          fi
          test -s "Instit-$RELEASE_VERSION.dmg"
          test -s "Instit-$RELEASE_VERSION-macOS.zip"
          test -s "Instit-$RELEASE_VERSION-macOS.md"
          test -s appcast.xml
          grep -Fq "/releases/download/v$RELEASE_VERSION/Instit-$RELEASE_VERSION-macOS.zip" appcast.xml
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "payload/Instit-$RELEASE_VERSION.dmg" \
            "payload/Instit-$RELEASE_VERSION-macOS.zip" \
            "payload/appcast.xml" \
            --title "Instit $RELEASE_VERSION" \
            --notes-file "payload/Instit-$RELEASE_VERSION-macOS.md" \
            --latest
